<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Sign-up Form</title>
  </head>
  <body>
    <main class="container">
      <!-- left side -->
      <aside class="left-section">
        <div class="logo-container">
          <img src="images/odin-lined.png" alt="Odin logo" />
          <h1>ODIN</h1>
        </div>

        <p class="photo-credit">Photo by ...</p>
      </aside>

      <!-- right side -->
      <section class="right-section">
        <div class="intro">
        
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams.
          Sign up <em>now</em> to get started.

          <p>You know you want to.</p>
        </div>
       
        
<div class="form-section">
        <form class="signup-form">
          <p class="form-title">Let's do this!</p>
          <div class="form-columns">
            <div class="left-side-form">
              <div class="form-group">
                <label for="fname">First Name</label>
                <input
                  type="text"
                  id="fname"
                  name="first-name"
                  placeholder="Thor"
                  required
                />
              </div>
              <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="user-email" required />
              </div>
              <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required />
              </div>
            </div>
            <div class="right-side-form">
              <div class="form-group">
                <label for="lname">Last Name</label>
                <input
                  type="text"
                  name="last-name"
                  id="lname"
                  placeholder="Odinson"
                  required
                />
              </div>
              <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" name="phone-number" id="phone" required />
              </div>
              <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input
                  type="password"
                  id="confirm-password"
                  name="confirm-password"
                  required
                  autocomplete="new-password"
                />
              </div>
            </div>
          </div>

         
        </form>
         
</div>
<div class="action">
            <button type="submit">Create account</button>
          </div>
        <div>
          <p class="login">Already have account? <a href="#"> Log in </a></p>
        </div>
      </section>
    </main>
  </body>
</html>
